name: Publicar sitio

# Cada vez que alguien guarda cambios en el código fuente (rama eleventy-prueba), Eleventy construye
# el sitio y deja las páginas nuevas en la rama main, que es la que sirve GitHub Pages. También publica
# el editor web en relievemag.com/editor/ (carpeta editor/ del código fuente).
on:
  push:
    branches: [eleventy-prueba]
    paths: ["src/**", "editor/**", "eleventy.config.js", "package.json", "package-lock.json", ".github/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Código fuente
        uses: actions/checkout@v4
        with:
          ref: eleventy-prueba
          path: fuente
      - name: Sitio publicado
        uses: actions/checkout@v4
        with:
          ref: main
          path: sitio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fuente/package-lock.json
      - name: Construir con Eleventy
        working-directory: fuente
        run: |
          npm ci
          npx eleventy
      - name: Copiar a main
        run: fuente/.github/scripts/desplegar.sh fuente sitio
      - name: Guardar en main
        working-directory: sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "RELIEVE bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada que publicar"; exit 0; fi
          git commit -m "Publica: ${{ github.event.head_commit.message || 'actualización' }}" -m "Construido por Eleventy desde ${GITHUB_SHA::7}"
          git push origin main
          # Un empujón con el token de Actions no siempre arranca la publicación de Pages: se pide a mano.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
